networks:
  music-network:
    driver: bridge
  grpc-network:
    driver: bridge

services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8080:8080"   # REST API
      - "9090:9090"   # gRPC
    environment:
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/musicdb
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  user-gripmock:
    image: tkpd/gripmock:latest
    container_name: user-gripmock
    ports:
      - "50051:4770"
      - "4771:4771"
    volumes:
      - ./post-service/src/main/proto:/proto:ro
      - ./post-service/gripmock/user/stubs:/stubs
    command:
      - "--stub=/stubs"
      - "/proto/user.proto"
    networks:
      - grpc-network

  post-service:
    build: ./post-service
    container_name: post-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=9090
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/musicdb
    depends_on:
      user-service:
        condition: service_healthy
    networks:
      - music-network